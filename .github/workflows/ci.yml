name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build test image
      run: |
        echo "Building Docker image..."
        docker build -t rag-chatbot:test . --progress=plain
        echo "Build completed. Listing images:"
        docker images

    - name: Run unit tests
      run: |
        docker run --rm rag-chatbot:test pytest -m "unit" app/

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build test image
      run: |
        docker build -t rag-chatbot:test . --progress=plain

    - name: Run integration tests
      run: |
        docker run -d --name rag-test -p 8000:8000 rag-chatbot:test
        sleep 5
        docker run --rm --network host rag-chatbot:test pytest -m integration app/tests/integration/
        docker stop rag-test
        docker rm rag-test

  build:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build production image
      run: |
        echo "Building production image..."
        docker build -t rag-chatbot:latest . --progress=plain
        echo "Build completed. Listing images:"
        docker images
