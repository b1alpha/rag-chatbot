name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build test image
      run: |
        docker build -t rag-chatbot:test .

    - name: Verify image exists
      run: docker images | grep rag-chatbot:test

    - name: Run unit tests
      run: |
        # Create directory for coverage reports
        mkdir -p coverage-reports
        # Run tests with coverage, mounting the reports directory
        docker run --rm \
          -e CHROMA_PERSIST_DIR=/app/chroma_store \
          -v $(pwd)/coverage-reports:/app/htmlcov \
          rag-chatbot:test \
          pytest -m "unit" app/ --cov=app --cov-report=term-missing --cov-report=html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-reports/
        retention-days: 7

    - name: Run integration tests
      run: |
        # Start the container in the background
        docker run -d --name rag-test \
          -e CHROMA_PERSIST_DIR=/app/chroma_store \
          -p 8000:8000 \
          rag-chatbot:test

        # Wait for the container to be ready
        sleep 5

        # Run the integration tests
        docker run --rm \
          --network host \
          -v $(pwd):/app \
          -w /app \
          python:3.11-slim \
          bash -c "pip install pytest requests && pytest -m integration app/tests/integration/"

        # Clean up
        docker stop rag-test
        docker rm rag-test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build production image
      run: |
        docker build -t rag-chatbot:latest .
