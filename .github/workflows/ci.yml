name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build test image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: rag-chatbot:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run unit tests
      run: |
        docker run --rm \
          -e OPENAI_API_KEY=dummy-key \
          -e CHROMA_PERSIST_DIR=/app/chroma_store \
          rag-chatbot:test \
          pytest -m "unit" app/ --cov=app --cov-report=term-missing --cov-report=html

    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 7

    - name: Run integration tests
      run: |
        # Start the container in the background
        docker run -d --name rag-test \
          -e OPENAI_API_KEY=dummy-key \
          -e CHROMA_PERSIST_DIR=/app/chroma_store \
          -p 8000:8000 \
          rag-chatbot:test

        # Wait for the container to be ready
        sleep 5

        # Run the integration tests
        docker run --rm \
          --network host \
          -v $(pwd):/app \
          -w /app \
          python:3.11-slim \
          bash -c "pip install pytest requests && pytest -m integration app/tests/integration/"

        # Clean up
        docker stop rag-test
        docker rm rag-test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build production image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: rag-chatbot:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
